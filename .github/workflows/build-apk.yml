
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">
<title>Para Takip</title>

<style>
:root {
  --bg: #0b1120;
  --card: #151e30;
  --card2: #1d2940;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --green: #34d399;
  --red: #fb7185;
  --blue: #60a5fa;
  --border: #29364d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 900px;
  min-height: 100vh;
  margin: auto;
  padding: 18px 14px 35px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

h1 {
  margin: 0;
  font-size: 25px;
}

h2 {
  font-size: 18px;
  margin: 0 0 16px;
}

h3 {
  font-size: 15px;
  margin: 0 0 10px;
}

p {
  color: var(--muted);
}

.muted {
  color: var(--muted);
  font-size: 12px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 17px;
  margin-bottom: 15px;
  min-width: 0;
}

.balance-main {
  background: linear-gradient(135deg, #1b3150, #152137);
  border-color: #304a6b;
}

.balance-label {
  font-size: 13px;
  color: #cbd5e1;
}

.balance-value {
  font-size: 30px;
  font-weight: 750;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.balance-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.balance-item {
  padding: 13px;
  background: var(--card2);
  border-radius: 13px;
  min-width: 0;
}

.balance-item .amount {
  display: block;
  font-size: 18px;
  font-weight: 700;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 17px;
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 8px 0;
}

.tab {
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--muted);
  font-weight: 700;
}

.tab.active {
  background: var(--blue);
  color: #07111f;
  border-color: var(--blue);
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  border-radius: 13px;
  padding: 14px;
  background: var(--card2);
  min-width: 0;
}

.stat-label {
  font-size: 12px;
  color: var(--muted);
}

.stat-value {
  font-size: 18px;
  font-weight: 750;
  margin-top: 8px;
  overflow-wrap: anywhere;
}

.green {
  color: var(--green);
}

.red {
  color: var(--red);
}

.blue {
  color: var(--blue);
}

label {
  display: block;
  font-size: 13px;
  color: #cbd5e1;
  margin-bottom: 7px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  background: #0e1728;
  color: var(--text);
  border-radius: 10px;
  outline: none;
  min-width: 0;
}

input:focus, select:focus {
  border-color: var(--blue);
}

.field {
  margin-bottom: 14px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.btn {
  border: none;
  padding: 12px 15px;
  border-radius: 11px;
  font-weight: 750;
}

.btn-primary {
  width: 100%;
  background: var(--green);
  color: #06251b;
}

.btn-secondary {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-danger {
  background: #43202e;
  color: #fecdd3;
  border: 1px solid #693044;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.transaction {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.transaction:last-child {
  border-bottom: none;
}

.transaction-info {
  flex: 1;
  min-width: 0;
}

.transaction-info strong {
  display: block;
  overflow-wrap: anywhere;
}

.transaction-info small {
  color: var(--muted);
  display: block;
  margin-top: 4px;
}

.transaction-right {
  text-align: right;
  flex-shrink: 0;
}

.transaction-amount {
  display: block;
  font-size: 13px;
  font-weight: 750;
  overflow-wrap: anywhere;
}

.delete-btn {
  margin-top: 7px;
  padding: 5px 9px;
  font-size: 11px;
  border-radius: 7px;
}

.empty {
  padding: 18px 5px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.month-box {
  padding: 13px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 12px;
  min-width: 0;
}

.month-box h3 {
  margin-bottom: 12px;
}

.month-box p {
  font-size: 12px;
  margin: 7px 0;
}

.month-box strong {
  overflow-wrap: anywhere;
}

.donut-layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding-top: 10px;
}

.donut-chart {
  width: 230px;
  height: 230px;
  max-width: 100%;
  border-radius: 50%;
  background: conic-gradient(#29364d 0deg 360deg);
  display: grid;
  place-items: center;
  position: relative;
  flex-shrink: 0;
}

.donut-center {
  width: 145px;
  height: 145px;
  border-radius: 50%;
  background: var(--card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-align: center;
  padding: 10px;
}

.donut-center span {
  color: var(--muted);
  font-size: 10px;
}

.donut-center strong {
  font-size: 18px;
  overflow-wrap: anywhere;
}

.donut-legend {
  width: 100%;
  min-width: 0;
}

.donut-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.donut-dot {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  flex-shrink: 0;
}

.donut-category {
  flex: 1;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.donut-value {
  text-align: right;
  font-size: 12px;
}

.donut-value strong {
  display: block;
  margin-bottom: 4px;
}

.chart-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.bar-row {
  display: grid;
  grid-template-columns: 75px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
}

.bar-label {
  color: var(--muted);
  font-size: 12px;
}

.bar-track {
  background: #253249;
  border-radius: 6px;
  min-height: 26px;
  position: relative;
  overflow: hidden;
}

.bar-fill {
  min-height: 26px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding-left: 8px;
  color: #081421;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  transition: width .25s ease;
}

.rate-row {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.rate-row span {
  font-weight: 700;
}

.notice {
  padding: 11px;
  background: #102b35;
  color: #a7f3d0;
  border-radius: 10px;
  font-size: 12px;
  margin-bottom: 12px;
}

@media (min-width: 520px) {
  .balance-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .month-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .donut-layout {
    flex-direction: row;
    align-items: center;
  }

  .donut-chart {
    width: 205px;
    height: 205px;
  }

  .donut-center {
    width: 130px;
    height: 130px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div>
      <h1>Para Takip</h1>
      <div class="muted">Gelirlerini ve giderlerini kontrol et</div>
    </div>
    <button class="btn btn-secondary" id="backupButton">Yedekle</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-page="home">Ana Sayfa</button>
    <button class="tab" data-page="stats">İstatistikler</button>
  </nav>

  <main id="home" class="page active">

    <section class="card balance-main">
      <div class="balance-label">Toplam net bakiye · TL karşılığı</div>
      <div class="balance-value" id="totalBalance">0,00 TL</div>
      <div class="muted">Farklı para birimlerindeki bakiyelerin toplamı</div>
    </section>

    <section class="card">
      <h2>Para Birimi Bakiyeleri</h2>
      <div class="balance-grid" id="balances"></div>
    </section>

    <section class="card">
      <h2>Yeni İşlem</h2>

      <div class="field">
        <label for="type">İşlem türü</label>
        <select id="type">
          <option value="income">Gelir</option>
          <option value="expense">Gider</option>
        </select>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="amount">Tutar</label>
          <input id="amount" type="number" min="0.01" step="any"
                 placeholder="Örn. 1500" required>
        </div>

        <div class="field">
          <label for="currency">Para birimi</label>
          <select id="currency">
            <option value="TRY">Türk Lirası (₺)</option>
            <option value="EUR">Euro (€)</option>
            <option value="USD">ABD Doları ($)</option>
            <option value="GBP">İngiliz Sterlini (£)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="category">Kategori</label>
        <select id="category"></select>
      </div>

      <div class="field">
        <label for="date">Tarih</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label for="note">Açıklama (isteğe bağlı)</label>
        <input id="note" type="text" maxlength="100"
               placeholder="Örn. Ekim maaşı">
      </div>

      <button class="btn btn-primary" id="addButton">İşlemi Kaydet</button>
    </section>

    <section class="card">
      <h2>Son İşlemler</h2>
      <div id="transactions"></div>
    </section>

    <section class="card">
      <h2>Para Birimi Kurları</h2>
      <p class="muted">
        Her kur, 1 birim yabancı paranın kaç TL ettiğini gösterir.
        İnternet üzerinden kur alınamazsa kayıtlı kur kullanılır.
      </p>
      <div id="rateInputs"></div>

      <div class="button-row">
        <button class="btn btn-secondary" id="saveRates">Kurları Kaydet</button>
        <button class="btn btn-secondary" id="refreshRates">İnternetten Kur Al</button>
      </div>
      <p class="muted" id="rateStatus"></p>
    </section>

    <section class="card">
      <h2>Veri Yedekleme</h2>
      <p class="muted">
        Verilerini JSON dosyası olarak kaydedebilir veya daha önce aldığın
        yedeği geri yükleyebilirsin.
      </p>
      <div class="field">
        <label for="restoreFile">Yedek dosyası</label>
        <input id="restoreFile" type="file" accept=".json,application/json">
      </div>
      <button class="btn btn-secondary" id="restoreButton">Yedeği Geri Yükle</button>
    </section>

  </main>

  <main id="stats" class="page">

    <section class="card">
      <h2>Aylık Rapor</h2>
      <div class="field">
        <label for="reportMonth">Rapor ayı</label>
        <input type="month" id="reportMonth">
      </div>

      <div class="grid">
        <div class="stat">
          <div class="stat-label">Toplam Gelir</div>
          <div class="stat-value green" id="monthIncome">0 TL</div>
        </div>
        <div class="stat">
          <div class="stat-label">Toplam Gider</div>
          <div class="stat-value red" id="monthExpense">0 TL</div>
        </div>
        <div class="stat">
          <div class="stat-label">Net Fark</div>
          <div class="stat-value" id="monthNet">0 TL</div>
        </div>
        <div class="stat">
          <div class="stat-label">İşlem Sayısı</div>
          <div class="stat-value blue" id="monthCount">0</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Aylara Göre Gelir ve Gider</h2>
      <div id="monthlyChart" class="chart-list"></div>
    </section>

    <section class="card">
      <h2>Haftalık Giderler</h2>
      <p class="muted">Seçtiğin ayın haftalara bölünmüş giderleri</p>
      <div id="weeklyChart" class="chart-list"></div>
    </section>

    <section class="card">
      <h2>Harcama Dağılımı</h2>
      <p class="muted">Giderlerin hangi kategorilere dağıldığını gösterir.</p>

      <div class="donut-layout">
        <div class="donut-chart" id="donutChart">
          <div class="donut-center">
            <span>TOPLAM GİDER</span>
            <strong id="donutTotal">0 TL</strong>
          </div>
        </div>
        <div id="donutLegend" class="donut-legend"></div>
      </div>
    </section>

    <section class="card">
      <h2>Her Ay Ayrı Ayrı</h2>
      <p class="muted">Her kutuda o ayın gelirini, giderini ve net farkını görebilirsin.</p>
      <div id="monthBoxes" class="month-grid"></div>
    </section>

  </main>
</div>

<script>
"use strict";

const STORAGE_KEY = "paraTakip_full_v1";

const incomeCategories = ["Maaş", "Destek", "Hediye"];

const expenseCategories = [
  "Kira",
  "Faturalar",
  "Market",
  "Ulaşım",
  "Yemek",
  "Sağlık",
  "Sigara",
  "Borç",
  "Eğlence",
  "Diğer"
];

const currencies = ["TRY", "EUR", "USD", "GBP"];

const currencyNames = {
  TRY: "TL",
  EUR: "EUR",
  USD: "USD",
  GBP: "GBP"
};

const currencySymbols = {
  TRY: "₺",
  EUR: "€",
  USD: "$",
  GBP: "£"
};

const donutColors = [
  "#34d399",
  "#60a5fa",
  "#a78bfa",
  "#fb7185",
  "#fbbf24",
  "#2dd4bf",
  "#f97316",
  "#818cf8",
  "#e879f9",
  "#94a3b8"
];

function localDateString(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function localMonthString(date = new Date()) {
  return localDateString(date).slice(0, 7);
}

function initialData() {
  return {
    transactions: [],
    rates: {
      TRY: 1,
      EUR: 0,
      USD: 0,
      GBP: 0
    },
    rateDate: ""
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return initialData();

    const parsed = JSON.parse(raw);

    return {
      transactions: Array.isArray(parsed.transactions)
        ? parsed.transactions.filter(isValidTransaction)
        : [],
      rates: {
        TRY: 1,
        EUR: Number(parsed.rates?.EUR) || 0,
        USD: Number(parsed.rates?.USD) || 0,
        GBP: Number(parsed.rates?.GBP) || 0
      },
      rateDate: parsed.rateDate || ""
    };
  } catch (error) {
    console.error("Veriler okunamadı:", error);
    return initialData();
  }
}

let state = loadData();

function isValidTransaction(t) {
  return t &&
    typeof t.id === "string" &&
    (t.type === "income" || t.type === "expense") &&
    Number.isFinite(Number(t.amount)) &&
    Number(t.amount) > 0 &&
    currencies.includes(t.currency) &&
    typeof t.date === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(t.date);
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function el(id) {
  return document.getElementById(id);
}

function create(tag, className = "", text = "") {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== "") node.textContent = text;
  return node;
}

function money(amount, currency = "TRY") {
  return new Intl.NumberFormat("tr-TR", {
    style: "currency",
    currency,
    maximumFractionDigits: 2
  }).format(Number(amount) || 0);
}

function toTL(transaction) {
  const amount = Number(transaction.amount);
  if (transaction.currency === "TRY") return amount;

  const rate = Number(state.rates[transaction.currency]);
  if (!Number.isFinite(rate) || rate <= 0) return null;

  return amount * rate;
}

function getTLTotal(transactions) {
  let total = 0;
  let complete = true;

  transactions.forEach(t => {
    const converted = toTL(t);
    if (converted === null) {
      complete = false;
    } else {
      total += converted;
    }
  });

  return { total, complete };
}

function formatTL(amount, complete = true) {
  const formatted = money(amount, "TRY");
  return complete ? formatted : `${formatted}*`;
}

function getTransactionsByMonth(month) {
  return state.transactions.filter(t => t.date.startsWith(month));
}

function getMonthTotals(month) {
  const list = getTransactionsByMonth(month);
  const income = getTLTotal(list.filter(t => t.type === "income"));
  const expense = getTLTotal(list.filter(t => t.type === "expense"));

  return {
    list,
    income: income.total,
    expense: expense.total,
    incomeComplete: income.complete,
    expenseComplete: expense.complete,
    net: income.total - expense.total,
    complete: income.complete && expense.complete
  };
}

function updateCategoryOptions() {
  const type = el("type").value;
  const categories = type === "income"
    ? incomeCategories
    : expenseCategories;

  const select = el("category");
  const previous = select.value;

  select.replaceChildren();

  categories.forEach(category => {
    select.add(new Option(category, category));
  });

  if (categories.includes(previous)) {
    select.value = previous;
  }
}

function renderBalances() {
  const balances = {};

  currencies.forEach(currency => {
    balances[currency] = 0;
  });

  state.transactions.forEach(t => {
    const sign = t.type === "income" ? 1 : -1;
    balances[t.currency] += sign * Number(t.amount);
  });

  const container = el("balances");
  container.replaceChildren();

  currencies.forEach(currency => {
    const box = create("div", "balance-item");
    box.appendChild(create("span", "muted", currency));

    const amount = create(
      "span",
      "amount",
      money(balances[currency], currency)
    );

    box.appendChild(amount);

    if (currency !== "TRY" && state.rates[currency] <= 0) {
      box.appendChild(create(
        "div",
        "muted",
        "TL karşılığı için kur gir"
      ));
    } else if (currency !== "TRY") {
      box.appendChild(create(
        "div",
        "muted",
        "≈ " + money(balances[currency] * state.rates[currency], "TRY")
      ));
    }

    container.appendChild(box);
  });

  const total = getTLTotal(
    state.transactions.map(t => ({
      ...t,
      amount: Number(t.amount) * (t.type === "income" ? 1 : -1)
    }))
  );

  el("totalBalance").textContent =
    formatTL(total.total, total.complete);
}

function renderTransactions() {
  const container = el("transactions");
  container.replaceChildren();

  const list = [...state.transactions]
    .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id))
    .slice(0, 100);

  if (list.length === 0) {
    container.appendChild(create(
      "div",
      "empty",
      "Henüz işlem eklemedin."
    ));
    return;
  }

  list.forEach(t => {
    const row = create("div", "transaction");
    const info = create("div", "transaction-info");

    info.appendChild(create(
      "strong",
      "",
      t.category
    ));

    const details = [
      t.date,
      t.note || "",
      t.currency
    ].filter(Boolean).join(" · ");

    info.appendChild(create("small", "", details));

    const right = create("div", "transaction-right");
    const amount = create(
      "span",
      "transaction-amount " + (t.type === "income" ? "green" : "red"),
      `${t.type === "income" ? "+" : "−"}${money(t.amount, t.currency)}`
    );

    right.appendChild(amount);

    const deleteButton = create("button", "btn btn-danger delete-btn", "Sil");
    deleteButton.type = "button";
    deleteButton.addEventListener("click", () => deleteTransaction(t.id));

    right.appendChild(deleteButton);
    row.append(info, right);
    container.appendChild(row);
  });

  if (state.transactions.length > 100) {
    container.appendChild(create(
      "p",
      "muted",
      "Son 100 işlem gösteriliyor."
    ));
  }
}

function deleteTransaction(id) {
  const transaction = state.transactions.find(t => t.id === id);
  if (!transaction) return;

  if (!confirm(
    `${transaction.category} işlemini silmek istediğine emin misin?`
  )) return;

  state.transactions = state.transactions.filter(t => t.id !== id);
  saveData();
  renderAll();
}

function renderDonutChart() {
  const chart = el("donutChart");
  const legend = el("donutLegend");
  const totalText = el("donutTotal");
  const month = el("reportMonth").value;

  const expenses = getTransactionsByMonth(month)
    .filter(t => t.type === "expense");

  const categoryTotals = {};
  let complete = true;

  expenses.forEach(t => {
    const value = toTL(t);
    if (value === null) {
      complete = false;
      return;
    }

    categoryTotals[t.category] =
      (categoryTotals[t.category] || 0) + value;
  });

  const entries = Object.entries(categoryTotals)
    .filter(([_, value]) => value > 0)
    .sort((a, b) => b[1] - a[1]);

  const total = entries.reduce((sum, entry) => sum + entry[1], 0);

  totalText.textContent = formatTL(total, complete);
  legend.replaceChildren();

  if (total <= 0) {
    chart.style.background = "conic-gradient(#29364d 0deg 360deg)";
    legend.appendChild(create(
      "div",
      "empty",
      "Bu ay için gider kaydı bulunmuyor."
    ));
    return;
  }

  let angle = 0;
  const segments = [];

  entries.forEach(([category, amount], index) => {
    const nextAngle = angle + amount / total * 360;
    const color = donutColors[index % donutColors.length];

    segments.push(`${color} ${angle}deg ${nextAngle}deg`);
    angle = nextAngle;

    const row = create("div", "donut-item");
    const dot = create("span", "donut-dot");
    dot.style.background = color;

    const name = create("span", "donut-category", category);
    const value = create("div", "donut-value");

    value.appendChild(create("strong", "", money(amount, "TRY")));

    value.appendChild(create(
      "span",
      "muted",
      (amount / total * 100).toLocaleString("tr-TR", {
        maximumFractionDigits: 1
      }) + "%"
    ));

    row.append(dot, name, value);
    legend.appendChild(row);
  });

  chart.style.background = `conic-gradient(${segments.join(", ")})`;

  if (!complete) {
    legend.appendChild(create(
      "p",
      "muted",
      "* Kuru tanımlanmamış para birimindeki giderler grafiğe dahil edilemedi."
    ));
  }
}

function addBar(container, label, value, max, color, valueText) {
  const row = create("div", "bar-row");
  row.appendChild(create("div", "bar-label", label));

  const track = create("div", "bar-track");
  const fill = create("div", "bar-fill");

  const percent = max > 0
    ? Math.min(100, value / max * 100)
    : 0;

  fill.style.width = value > 0
    ? `${Math.max(percent, 2)}%`
    : "0%";

  fill.style.background = color;

  if (value > 0) {
    fill.textContent = valueText;
  }

  track.appendChild(fill);
  row.appendChild(track);
  container.appendChild(row);
}

function renderMonthlyChart() {
  const container = el("monthlyChart");
  container.replaceChildren();

  const current = el("reportMonth").value;
  const [year, month] = current.split("-").map(Number);

  const months = [];

  for (let i = 5; i >= 0; i--) {
    const date = new Date(year, month - 1 - i, 1);
    months.push(localMonthString(date));
  }

  const values = months.map(m => ({
    month: m,
    totals: getMonthTotals(m)
  }));

  const max = Math.max(
    1,
    ...values.map(v => Math.max(v.totals.income, v.totals.expense))
  );

  values.forEach(v => {
    const label = v.month.slice(5) + "/" + v.month.slice(0, 4).slice(2);

    const row = create("div");
    row.style.marginBottom = "8px";

    row.appendChild(create("div", "muted", label));

    addBar(
      row,
      "Gelir",
      v.totals.income,
      max,
      "#34d399",
      money(v.totals.income, "TRY")
    );

    addBar(
      row,
      "Gider",
      v.totals.expense,
      max,
      "#fb7185",
      money(v.totals.expense, "TRY")
    );

    if (!v.totals.complete) {
      row.appendChild(create(
        "div",
        "muted",
        "* Bazı para birimlerinin kuru eksik."
      ));
    }

    container.appendChild(row);
  });
}

function renderWeeklyChart() {
  const container = el("weeklyChart");
  container.replaceChildren();

  const month = el("reportMonth").value;
  const [year, monthNumber] = month.split("-").map(Number);
  const daysInMonth = new Date(year, monthNumber, 0).getDate();
  const weeks = [];

  for (let start = 1; start <= daysInMonth; start += 7) {
    const end = Math.min(start + 6, daysInMonth);

    weeks.push({
      start,
      end,
      total: 0,
      complete: true
    });
  }

  getTransactionsByMonth(month)
    .filter(t => t.type === "expense")
    .forEach(t => {
      const day = Number(t.date.slice(8, 10));
      const week = weeks.find(w => day >= w.start && day <= w.end);
      if (!week) return;

      const value = toTL(t);
      if (value === null) {
        week.complete = false;
      } else {
        week.total += value;
      }
    });

  const max = Math.max(1, ...weeks.map(w => w.total));

  weeks.forEach(week => {
    addBar(
      container,
      `${week.start}-${week.end}`,
      week.total,
      max,
      "#60a5fa",
      money(week.total, "TRY")
    );

    if (!week.complete) {
      container.appendChild(create(
        "p",
        "muted",
        "Bu haftada kuru eksik bir işlem bulunuyor."
      ));
    }
  });
}

function renderMonthBoxes() {
  const container = el("monthBoxes");
  container.replaceChildren();

  const selected = el("reportMonth").value;
  const [year, month] = selected.split("-").map(Number);

  for (let i = 0; i < 12; i++) {
    const date = new Date(year, month - 1 - i, 1);
    const monthKey = localMonthString(date);
    const totals = getMonthTotals(monthKey);

    const box = create("div", "month-box");

    box.appendChild(create(
      "h3",
      "",
      date.toLocaleDateString("tr-TR", {
        month: "long",
        year: "numeric"
      })
    ));

    const income = create("p");
    income.append("Gelir: ");
    income.appendChild(create(
      "strong",
      "green",
      formatTL(totals.income, totals.incomeComplete)
    ));

    const expense = create("p");
    expense.append("Gider: ");
    expense.appendChild(create(
      "strong",
      "red",
      formatTL(totals.expense, totals.expenseComplete)
    ));

    const net = create("p");
    net.append("Net: ");
    net.appendChild(create(
      "strong",
      totals.net >= 0 ? "green" : "red",
      formatTL(totals.net, totals.complete)
    ));

    box.append(income, expense, net);
    container.appendChild(box);
  }
}

function renderStats() {
  const month = el("reportMonth").value;
  const totals = getMonthTotals(month);

  el("monthIncome").textContent =
    formatTL(totals.income, totals.incomeComplete);

  el("monthExpense").textContent =
    formatTL(totals.expense, totals.expenseComplete);

  el("monthNet").textContent =
    formatTL(totals.net, totals.complete);

  el("monthNet").className =
    "stat-value " + (totals.net >= 0 ? "green" : "red");

  el("monthCount").textContent = String(totals.list.length);

  renderMonthlyChart();
  renderWeeklyChart();
  renderDonutChart();
  renderMonthBoxes();
}

function renderRates() {
  const container = el("rateInputs");
  container.replaceChildren();

  ["EUR", "USD", "GBP"].forEach(currency => {
    const row = create("div", "rate-row");
    row.appendChild(create("span", "", currency));

    const input = create("input");
    input.type = "number";
    input.min = "0";
    input.step = "any";
    input.id = "rate_" + currency;
    input.placeholder = "1 " + currency + " kaç TL?";
    input.value = state.rates[currency] || "";

    row.appendChild(input);
    container.appendChild(row);
  });

  el("rateStatus").textContent = state.rateDate
    ? "Son kur güncellemesi: " + state.rateDate
    : "Henüz kur bilgisi alınmadı. Kurları kendin girebilir veya internetten deneyebilirsin.";
}

function saveRates() {
  for (const currency of ["EUR", "USD", "GBP"]) {
    const value = Number(el("rate_" + currency).value);

    if (!Number.isFinite(value) || value < 0) {
      alert("Kur alanlarına sıfır veya pozitif bir sayı gir.");
      return;
    }

    state.rates[currency] = value;
  }

  state.rates.TRY = 1;
  saveData();
  renderAll();

  alert("Kur bilgileri kaydedildi.");
}

async function refreshRates() {
  const button = el("refreshRates");
  button.disabled = true;
  el("rateStatus").textContent = "Kur bilgileri alınıyor...";

  try {
    const response = await fetch(
      "https://open.er-api.com/v6/latest/TRY",
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Kur servisine ulaşılamadı.");
    }

    const data = await response.json();

    if (data.result !== "success" || !data.rates) {
      throw new Error("Kur bilgisi geçersiz.");
    }

    for (const currency of ["EUR", "USD", "GBP"]) {
      const foreignPerTRY = Number(data.rates[currency]);

      if (foreignPerTRY > 0) {
        state.rates[currency] = 1 / foreignPerTRY;
      }
    }

    state.rateDate = new Date().toLocaleString("tr-TR");
    saveData();
    renderAll();

    el("rateStatus").textContent =
      "Kur bilgileri güncellendi. Son kontrol: " + state.rateDate;
  } catch (error) {
    el("rateStatus").textContent =
      "İnternetten kur alınamadı. Kurları yukarıdan elle girebilirsin.";
  } finally {
    button.disabled = false;
  }
}

function renderAll() {
  renderBalances();
  renderTransactions();
  renderRates();
  renderStats();
}

el("type").addEventListener("change", updateCategoryOptions);

el("addButton").addEventListener("click", () => {
  const amount = Number(el("amount").value);
  const currency = el("currency").value;
  const category = el("category").value;
  const date = el("date").value;
  const note = el("note").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    alert("Lütfen sıfırdan büyük geçerli bir tutar gir.");
    return;
  }

  if (!date) {
    alert("Lütfen işlem tarihini seç.");
    return;
  }

  const transaction = {
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random().toString(16).slice(2),
    type: el("type").value,
    amount,
    currency,
    category,
    date,
    note
  };

  state.transactions.push(transaction);
  saveData();

  el("amount").value = "";
  el("note").value = "";

  renderAll();
});

el("reportMonth").addEventListener("change", renderStats);
el("saveRates").addEventListener("click", saveRates);
el("refreshRates").addEventListener("click", refreshRates);

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab === button);
    });

    document.querySelectorAll(".page").forEach(page => {
      page.classList.toggle("active", page.id === button.dataset.page);
    });

    renderStats();
  });
});

el("backupButton").addEventListener("click", () => {
  const blob = new Blob(
    [JSON.stringify(state, null, 2)],
    { type: "application/json" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "para-takip-yedek-" + localDateString() + ".json";
  a.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

el("restoreButton").addEventListener("click", async () => {
  const file = el("restoreFile").files[0];

  if (!file) {
    alert("Önce bir yedek dosyası seç.");
    return;
  }

  if (!confirm("Mevcut verilerin yerine yedek dosyası yüklensin mi?")) {
    return;
  }

  try {
    const imported = JSON.parse(await file.text());

    if (!imported || !Array.isArray(imported.transactions)) {
      throw new Error("Geçersiz yedek dosyası.");
    }

    const validTransactions = imported.transactions.filter(isValidTransaction);

    if (validTransactions.length !== imported.transactions.length) {
      throw new Error("Yedek dosyasında geçersiz işlem var. Veriler yüklenmedi.");
    }

    state = {
      transactions: validTransactions,
      rates: {
        TRY: 1,
        EUR: Math.max(0, Number(imported.rates?.EUR) || 0),
        USD: Math.max(0, Number(imported.rates?.USD) || 0),
        GBP: Math.max(0, Number(imported.rates?.GBP) || 0)
      },
      rateDate: imported.rateDate || ""
    };

    saveData();
    renderAll();
    alert("Yedek başarıyla geri yüklendi.");
  } catch (error) {
    alert("Yedek yüklenemedi: " + error.message);
  }
});

el("date").value = localDateString();
el("reportMonth").value = localMonthString();

updateCategoryOptions();
renderAll();
</script>
</body>
</html>
