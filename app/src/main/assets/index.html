
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>Para Takip</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#f4f6fb;font-family:Arial,sans-serif;padding:18px 15px 90px}
h1{margin:0 0 6px;font-size:26px}
p{color:#a3abc0}
.card{background:#191e2b;border:1px solid #30384b;border-radius:15px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-size:12px;color:#a3abc0;margin-bottom:8px}
.amount{font-size:21px;font-weight:bold;overflow-wrap:anywhere}
.green{color:#45d6a0}.red{color:#ff7082}.blue{color:#8da7ff}
input,select,button,textarea{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid #30384b;margin:5px 0;background:#101521;color:white}
button{background:#8da7ff;color:#10131c;font-weight:bold;border:0}
button.danger{background:#512632;color:#ffdbe0;width:auto;padding:7px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#191e2b;padding:8px;gap:5px}
nav button{font-size:12px;margin:0;background:#252d40;color:white}
.page{display:none}.page.active{display:block}
.tx{display:flex;align-items:center;gap:8px;border-bottom:1px solid #30384b;padding:12px 0}
.txinfo{flex:1;min-width:0}.txinfo small{display:block;color:#a3abc0;margin-top:5px}
.txright{text-align:right}.txright strong{display:block}
.progress{height:8px;background:#30384b;border-radius:8px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:#45d6a0}
small{overflow-wrap:anywhere}
</style>
</head>
<body>
<header><h1>Para Takip</h1><p>Gelirlerini, giderlerini ve bütçeni yönet.</p></header>

<section id="home" class="page active">
<h2>Genel durum</h2>
<div class="grid">
<div class="card"><div class="label">TL bakiyesi</div><div id="balance" class="amount">₺0,00</div></div>
<div class="card"><div class="label">Euro bakiyesi</div><div id="euroBalance" class="amount blue">€0,00</div></div>
<div class="card"><div class="label">Bu ay gelir</div><div id="income" class="amount green">₺0,00</div></div>
<div class="card"><div class="label">Bu ay gider</div><div id="expense" class="amount red">₺0,00</div></div>
</div>
<div class="card"><div class="label">Bu ay net</div><div id="net" class="amount">₺0,00</div></div>
<div class="card"><h3>Son işlemler</h3><div id="recent"></div></div>
<div class="card"><h3>Aylık bütçe</h3><div id="budgetText">Bütçe belirlenmedi.</div><div class="progress"><div id="progress" style="width:0%"></div></div></div>
</section>

<section id="transactions" class="page">
<h2>İşlemler</h2>
<div class="card">
<h3>Yeni işlem</h3>
<form id="txForm">
<label>İşlem türü</label>
<select id="type"><option value="expense">Gider</option><option value="income">Gelir</option></select>
<label>Para birimi</label>
<select id="currency"><option value="TRY">Türk lirası</option><option value="EUR">Euro</option></select>
<label>Tutar</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Tutar" required>
<label>Kategori</label>
<select id="category"><option>Yemek</option><option>Market</option><option>Kira</option><option>Ulaşım</option><option>Fatura</option><option>Maaş</option><option>Ek gelir</option><option>Alışveriş</option><option>Motor</option><option>Eğlence</option><option>Diğer</option></select>
<label>Tarih</label>
<input id="date" type="date" required>
<label>Açıklama</label>
<input id="note" maxlength="120" placeholder="İsteğe bağlı açıklama">
<button type="submit">İşlemi kaydet</button>
</form>
</div>
<div class="card"><h3>İşlem geçmişi</h3><select id="filter"><option value="all">Tüm işlemler</option><option value="income">Gelirler</option><option value="expense">Giderler</option></select><div id="history"></div></div>
</section>

<section id="settings" class="page">
<h2>Ayarlar</h2>
<div class="card">
<h3>Euro kuru</h3>
<label>1 Euro kaç TL?</label>
<input id="rate" type="number" min="0.01" step="0.01">
<button id="saveRate">Kuru kaydet</button>
</div>
<div class="card">
<h3>Aylık bütçe</h3>
<label>Bütçe (TL)</label>
<input id="budget" type="number" min="0" step="0.01">
<button id="saveBudget">Bütçeyi kaydet</button>
</div>
<div class="card">
<h3>Yedekleme</h3>
<button id="backup">Yedek oluştur</button>
<textarea id="backupData" rows="6" placeholder="Yedek burada görünür"></textarea>
<button id="restore">Yedeği geri yükle</button>
</div>
</section>

<nav>
<button data-page="home">Ana Sayfa</button>
<button data-page="transactions">İşlemler</button>
<button data-page="settings">Ayarlar</button>
</nav>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KEY="paraTakipRecordsV1";
const RATE="paraTakipEurRateV1";
const BUDGET="paraTakipMonthlyBudgetV1";
let records=[];
let rate=55;
let budget=0;

function today(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function month(){return today().slice(0,7);}
function money(n,c="TRY"){
 return new Intl.NumberFormat("tr-TR",{style:"currency",currency:c,minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function normalize(r){
 return {...r,id:r.id||("id_"+Date.now()+"_"+Math.random()),type:r.type==="income"?"income":"expense",amount:Number(r.amount)||0,currency:r.currency==="EUR"?"EUR":"TRY",category:String(r.category||"Diğer"),date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")?r.date:today(),note:String(r.note||"")};
}
function load(){
 try{
  let data=JSON.parse(localStorage.getItem(KEY)||"[]");
  records=Array.isArray(data)?data.filter(r=>r&&typeof r==="object").map(normalize):[];
 }catch(e){records=[];}
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(records));return true;}
 catch(e){alert("Kayıt kaydedilemedi. Depolama alanını kontrol et.");return false;}
}
function tl(r){
 if(r.currency==="EUR")return r.amount*rate;
 return r.amount;
}
function total(list,type){
 return list.filter(r=>r.type===type).reduce((s,r)=>s+tl(r),0);
}
function euroBalance(){
 return records.filter(r=>r.currency==="EUR").reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);
}
function txHtml(r,del){
 let income=r.type==="income";
 return '<div class="tx"><div class="txinfo"><strong>'+esc(r.category)+'</strong><small>'+esc(r.date)+(r.note?" · "+esc(r.note):"")+'</small></div><div class="txright"><strong class="'+(income?"green":"red")+'">'+(income?"+":"−")+money(r.amount,r.currency)+'</strong><small>'+money(tl(r))+'</small>'+(del?'<br><button type="button" class="danger" data-delete="'+esc(r.id)+'">Sil</button>':"")+'</div></div>';
}
function listHtml(list,del,limit){
 let sorted=[...list].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 if(limit)sorted=sorted.slice(0,limit);
 return sorted.length?sorted.map(r=>txHtml(r,del)).join(""):'<p>Henüz işlem yok.</p>';
}
function render(){
 let m=records.filter(r=>r.date.slice(0,7)===month());
 let inc=total(m,"income"),exp=total(m,"expense");
 $("balance").textContent=money(records.reduce((s,r)=>s+(r.type==="income"?tl(r):-tl(r)),0));
 $("euroBalance").textContent=money(euroBalance(),"EUR");
 $("income").textContent=money(inc);
 $("expense").textContent=money(exp);
 $("net").textContent=money(inc-exp);
 $("net").className="amount "+(inc>=exp?"green":"red");
 $("recent").innerHTML=listHtml(records,false,5);
 $("history").innerHTML=listHtml(records.filter(r=>$("filter").value==="all"||r.type===$("filter").value),true);
 $("budgetText").textContent=budget>0?"Harcanan: "+money(exp)+" / "+money(budget):"Bütçe belirlenmedi.";
 $("progress").style.width=(budget>0?Math.min(100,exp/budget*100):0)+"%";
 $("progress").style.background=budget>0&&exp>budget?"#ff7082":"#45d6a0";
}
function showPage(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id===id));
}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));

$("date").value=today();
$("txForm").addEventListener("submit",e=>{
 e.preventDefault();
 let amount=Number($("amount").value);
 if(!Number.isFinite(amount)||amount<=0){alert("Geçerli bir tutar gir.");return;}
 records.unshift(normalize({id:"id_"+Date.now()+"_"+Math.random(),type:$("type").value,currency:$("currency").value,amount,category:$("category").value,date:$("date").value||today(),note:$("note").value.trim()}));
 if(save()){
  $("amount").value="";
  $("note").value="";
  render();
  alert("İşlem kaydedildi.");
 }
});

/* Sil butonu için tek ve ortak olay dinleyicisi */
document.addEventListener("click",function(e){
 const button=e.target.closest("[data-delete]");
 if(!button)return;
 e.preventDefault();
 const id=button.getAttribute("data-delete");
 if(!confirm("Bu işlemi silmek istiyor musun?"))return;
 const old=records;
 records=records.filter(r=>String(r.id)!==String(id));
 if(records.length===old.length){alert("İşlem bulunamadı.");return;}
 if(save()){render();}
 else{records=old;render();}
});

$("filter").addEventListener("change",render);
$("saveRate").addEventListener("click",()=>{
 let v=Number($("rate").value);
 if(!Number.isFinite(v)||v<=0){alert("Geçerli bir euro kuru gir.");return;}
 rate=v;
 try{localStorage.setItem(RATE,String(rate));render();alert("Kur kaydedildi.");}
 catch(e){alert("Kur kaydedilemedi.");}
});
$("saveBudget").addEventListener("click",()=>{
 let v=Number($("budget").value);
 if(!Number.isFinite(v)||v<0){alert("Geçerli bir bütçe gir.");return;}
 budget=v;
 try{localStorage.setItem(BUDGET,String(budget));render();alert("Bütçe kaydedildi.");}
 catch(e){alert("Bütçe kaydedilemedi.");}
});
$("backup").addEventListener("click",()=>{
 $("backupData").value=JSON.stringify({records,rate,budget},null,2);
});
$("restore").addEventListener("click",()=>{
 let data;
 try{data=JSON.parse($("backupData").value);}
 catch(e){alert("Yedek dosyası geçersiz.");return;}
 if(!data||!Array.isArray(data.records)){alert("Yedekte işlem listesi bulunamadı.");return;}
 if(!confirm("Mevcut işlemlerin yerine yedek yüklenecek. Devam edilsin mi?"))return;
 let old=records;
 records=data.records.filter(r=>r&&typeof r==="object").map(normalize);
 let newRate=Number(data.rate),newBudget=Number(data.budget);
 if(newRate>0)rate=newRate;
 if(newBudget>=0)budget=newBudget;
 try{
  localStorage.setItem(KEY,JSON.stringify(records));
  localStorage.setItem(RATE,String(rate));
  localStorage.setItem(BUDGET,String(budget));
  $("rate").value=rate;$("budget").value=budget;
  render();alert("Yedek geri yüklendi.");
 }catch(e){records=old;render();alert("Yedek yüklenemedi.");}
});

try{
 const r=Number(localStorage.getItem(RATE));
 if(r>0)rate=r;
 const b=Number(localStorage.getItem(BUDGET));
 if(b>=0&&localStorage.getItem(BUDGET)!==null)budget=b;
}catch(e){}
$("rate").value=rate;
$("budget").value=budget||"";
load();
render();
})();
</script>
</body>
</html>
